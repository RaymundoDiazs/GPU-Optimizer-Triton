experiment:
  samples_per_model: 150
  seed: 7
  translation_examples_file: data/pytorch_examples.json

models:
  - id: small_qwen25_coder_1_5b
    tier: small
    display_name: Qwen2.5-Coder-1.5B (Ollama local)
    provider: ollama
    model_name: qwen2.5-coder:1.5b
    rationale: Small open-weight coder model running locally via Ollama. Zero cost, higher latency, no data leaves the machine.

  - id: frontier_openai
    tier: frontier
    display_name: GPT-4o (OpenAI)
    provider: openai
    model_name: gpt-4o
    rationale: High-quality frontier model via OpenAI API. Strong instruction following and code generation.

  - id: frontier_anthropic
    tier: frontier
    display_name: Claude Haiku 4.5 (Anthropic)
    provider: anthropic
    model_name: claude-haiku-4-5-20251001
    rationale: Fast frontier model via Anthropic API. Strong reasoning and structured output at low cost.

