name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Smoke test CLI
        run: python main.py --code "C = A + B" --output /tmp/gpu-optimizer-results.txt
      - name: Run tests
        run: pytest -q
